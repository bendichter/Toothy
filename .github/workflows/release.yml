name: release

# Cut a release by pushing a version tag:
#     git tag v0.1.0 && git push origin v0.1.0
#
# This builds the sdist + wheel and attaches them to a GitHub Release. Toothy is
# NOT published to PyPI yet; when that changes, add a publish job using PyPI
# trusted publishing (pypa/gh-action-pypi-publish) gated on the same test suite.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  # A release must not ship code that fails the suite.
  test:
    uses: ./.github/workflows/tests.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0   # full history, so release notes can diff against the previous tag

      - name: Resolve version
        id: version
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The git tag and the version in pyproject.toml must not drift apart.
      - name: Check tag matches package version
        run: |
          tag='${{ steps.version.outputs.tag }}'
          pkg=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${tag#v}" != "$pkg" ]; then
            echo "::error::Tag $tag does not match pyproject version $pkg."
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      # A wheel that can't be installed and imported is not a release.
      - name: Smoke-test the wheel
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon-x11-0
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp   # install must not depend on the source tree
          QT_QPA_PLATFORM=offscreen /tmp/smoke/bin/python -c "
          from toothy.toothy import main
          from toothy import ephys, pyfx, qparam
          assert callable(main)
          print('wheel imports cleanly')"
          test -x /tmp/smoke/bin/toothy || { echo "::error::toothy console script missing"; exit 1; }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Toothy ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## Install

            Download the wheel below, then:

            ```
            pip install toothy-${{ steps.version.outputs.tag }}.whl
            toothy
            ```

            Or install straight from the tag:

            ```
            pip install "git+https://github.com/${{ github.repository }}@${{ steps.version.outputs.tag }}"
            ```

            See the [README](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/README.md) for the full workflow.
