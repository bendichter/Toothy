name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:   # let release.yml gate on this suite

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash -el {0}   # login shell, so `conda activate` works

    steps:
      - uses: actions/checkout@v4

      # Qt needs these to start even under the offscreen platform plugin.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon-x11-0

      - name: Set up toothy_env
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: toothy_env
          auto-activate-base: false

      - name: Install test dependencies
        run: pip install pytest

      - name: Show environment
        run: |
          python --version
          python -c "import numpy, pandas, scipy; print('numpy', numpy.__version__, '| pandas', pandas.__version__, '| scipy', scipy.__version__)"

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen   # no display on CI runners
          MPLBACKEND: Agg
        run: pytest tests/ -v
